services:
  app:
    container_name: react-production
    image: react-production:prod
    build:
      context: ./MuniClient
      target: production
      args:
        - NODE_ENV=production
      dockerfile: Dockerfile.prod
    ports:
      - 80:80

  django:
    image: django_app
    container_name: django_app
    build:
      context: ./MuniServer
    ports:
      - "8000:8000"
    volumes:
      - ./MuniServer:/app
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    command: >
      bash -c "./wait-for-it.sh -t 30 mysql:3306 --
               python manage.py migrate &&
               gunicorn MuniServer.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    depends_on:
      - mysql

  mysql:
    image: mysql:latest
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    volumes:
      - django_react_data:/data/db
      - ./dumps:/docker-entrypoint-initdb.d:ro

volumes:
  django_react_data:
