# Producción: una instalación por municipalidad en un solo servidor.
# Las variables van en el archivo .env junto a este archivo (plantilla en despliegue/variables-produccion.ejemplo).
#   docker compose up -d --build
# Guía completa en despliegue/README.md.
name: munimanagement

# worker y beat usan la misma imagen que construye api (si la construyeran los tres a la vez, chocan).
x-api: &api
  image: munimanagement-api
  pull_policy: never
  restart: unless-stopped
  env_file: .env
  environment: &entorno
    DEBUG: "False"
    DB_HOST: mysql
    DB_NAME: ${DB_NAME:-MuniManagement}
    DB_USER: ${DB_USER:-muni}
    ALLOWED_HOSTS: ${DOMINIO:?Falta DOMINIO en .env}
    CSRF_TRUSTED_ORIGINS: https://${DOMINIO}
    FRONTEND_URL: https://${DOMINIO}
    REDIS_URL: redis://valkey:6379/0
    # Caddy pasa la IP real del visitante en X-Forwarded-For.
    RATELIMIT_IP_META_KEY: HTTP_X_FORWARDED_FOR

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-MuniManagement}
      MYSQL_USER: ${DB_USER:-muni}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD en .env}
    volumes:
      - mysql_datos:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Cola de Celery y caché del límite de intentos de login. Valkey es la versión libre (BSD) de Redis.
  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    <<: *api
    build: ./MuniServer
    pull_policy: build
    command: ["bash", "entrypoint-prod.sh"]
    volumes:
      - estaticos:/app/staticfiles
      - medios:/app/media
    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': os.environ['ALLOWED_HOSTS'].split(',')[0]}), timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 60s

  worker:
    <<: *api
    command: ["celery", "-A", "MuniServer", "worker", "-l", "info", "--concurrency=2"]
    depends_on:
      api:
        condition: service_healthy

  beat:
    <<: *api
    command: ["celery", "-A", "MuniServer", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on:
      api:
        condition: service_healthy

  # Front, proxy de la API y HTTPS.
  web:
    build:
      context: ./MuniClient-v2
      args:
        VITE_MAPA_ESTILO: ${MAPA_ESTILO:-}
        VITE_BUSQUEDA_DIRECCIONES: ${BUSQUEDA_DIRECCIONES:-}
    image: munimanagement-web
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO}
      # Orígenes que la CSP deja pedir para el mapa y la búsqueda de direcciones (ver despliegue/README.md).
      MAPA_ORIGEN: ${MAPA_ORIGEN:-https://tiles.openfreemap.org}
      BUSQUEDA_ORIGEN: ${BUSQUEDA_ORIGEN:-https://nominatim.openstreetmap.org}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - estaticos:/srv/static:ro
      - medios:/srv/media:ro
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  # Respaldo diario de la base en ./respaldos (se conservan RESPALDO_DIAS días).
  respaldo:
    image: mysql:8.4
    restart: unless-stopped
    entrypoint: ["bash", "/respaldo.sh"]
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-MuniManagement}
      DB_USER: ${DB_USER:-muni}
      DB_PASSWORD: ${DB_PASSWORD}
      RESPALDO_DIAS: ${RESPALDO_DIAS:-14}
    volumes:
      - ./respaldos:/respaldos
      - ./MuniServer/scripts/respaldo.sh:/respaldo.sh:ro
    depends_on:
      mysql:
        condition: service_healthy

  # Respaldo diario de las fotos guardadas en disco, junto a los de la base.
  respaldo_fotos:
    image: munimanagement-api
    pull_policy: never
    restart: unless-stopped
    # root, para escribir en ./respaldos (que el servicio respaldo deja en 700).
    user: "0:0"
    command: ["python", "scripts/respaldo_fotos.py"]
    environment:
      RESPALDO_DIAS: ${RESPALDO_DIAS:-14}
    volumes:
      - medios:/medios:ro
      - ./respaldos:/respaldos
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_datos:
  medios:
  estaticos:
  caddy_datos:
  caddy_config:
